version: '3.4'

services:
  bookstoreprisma:
    image: bookstoreprisma
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - 5000:5000
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Matikan security biar gampang akses
    ports:
      - "9200:9200"
      - "9300:9300"
